<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h2>Register</h2>
  <form id="registerForm">
    <input type="text" id="fullName" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>
  <p id="message"></p>
  <p>Already have an account? <a href="login.html">Login</a></p>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const messageEl = document.getElementById("message");
      messageEl.textContent = "";
      messageEl.className = "";

      const fullName = document.getElementById("fullName").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch(`${BASE_URL}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, fullName })
        });

        const data = await res.json();

        if (!res.ok) {
          messageEl.textContent = Array.isArray(data) ? data.join(", ") : (data.message || "Registration failed.");
          messageEl.className = "error";
          return;
        }

        messageEl.textContent = data.message + " (Check your API console for the verification link.)";
        messageEl.className = "success";
      } catch (err) {
        messageEl.textContent = "Something went wrong. Is the API running?";
        messageEl.className = "error";
      }
    });
  </script>
</body>
</html>
